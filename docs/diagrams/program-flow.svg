<text x="641" y="655.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" paint-order="stroke" stroke="#fff" stroke-width="8" stroke-linejoin="round">是</text>
<text x="470" y="748.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" paint-order="stroke" stroke="#fff" stroke-width="8" stroke-linejoin="round">否</text>
<text x="165" y="902.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" paint-order="stroke" stroke="#fff" stroke-width="8" stroke-linejoin="round">下一轮</text>
