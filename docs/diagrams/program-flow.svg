<rect x="365.0" y="79.0" width="160" height="48" rx="24.0" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="445" y="103.0" text-anchor="middle" dominant-baseline="central" font-size="25" font-weight="700">开始</text>
<rect x="280.0" y="152.0" width="330" height="68" rx="2" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="445" y="170.0" text-anchor="middle" dominant-baseline="central" font-size="25" font-weight="700">初始化外设与棋盘</text><text x="445" y="202.0" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400">普通模式开局，黑棋先行</text>
<rect x="262.0" y="254.0" width="366" height="82" rx="2" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="445" y="279.0" text-anchor="middle" dominant-baseline="central" font-size="25" font-weight="700">处理时间与控制请求</text><text x="445" y="311.0" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400">先核对双钟到点，再处理按键与串口</text>
<polygon points="445,378.5 603.0,428 445,477.5 287.0,428" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="445" y="428.0" text-anchor="middle" dominant-baseline="central" font-size="23" font-weight="700">本轮有合法落子？</text>
<rect x="290.0" y="513.0" width="310" height="74" rx="2" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="445" y="534.0" text-anchor="middle" dominant-baseline="central" font-size="25" font-weight="700">放子、翻转并换手</text><text x="445" y="566.0" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400">检查下一方是否还有合法位置</text>
<polygon points="445,625.0 598.0,675 445,725.0 292.0,675" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="445" y="659.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700">需结算本局？</text><text x="445" y="691.0" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="400">到点或自然终局</text>
<rect x="693.0" y="638.0" width="260" height="74" rx="2" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="823" y="659.0" text-anchor="middle" dominant-baseline="central" font-size="25" font-weight="700">结算得分与胜负</text><text x="823" y="691.0" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400">比较黑白棋子数</text>
<rect x="283.0" y="794.0" width="324" height="82" rx="2" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="445" y="819.0" text-anchor="middle" dominant-baseline="central" font-size="25" font-weight="700">刷新点阵并同步状态</text><text x="445" y="851.0" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400">有变化时上报棋盘及回合</text>
